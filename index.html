<script>
// ============================================================
// DBF文件生成器（真正的dBase III格式）
// ============================================================
class DBFWriter {
    constructor(fields) {
        this.fields = fields;
        this.records = [];
    }
    addRecord(values) { this.records.push(values); }
    generate() {
        let data = '';
        const version = 3;
        const now = new Date();
        const year = now.getFullYear() - 1900;
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const recordCount = this.records.length;
        const headerSize = 32 + this.fields.length * 32 + 1;
        let recordLen = 1;
        this.fields.forEach(f => recordLen += f.len);
        const dataSize = recordLen * recordCount;
        
        // 文件头 (32 bytes)
        data += String.fromCharCode(version);
        data += String.fromCharCode(year);
        data += String.fromCharCode(month);
        data += String.fromCharCode(day);
        for (let i = 0; i < 4; i++) data += String.fromCharCode((recordCount >> (i * 8)) & 0xFF);
        for (let i = 0; i < 2; i++) data += String.fromCharCode((headerSize >> (i * 8)) & 0xFF);
        for (let i = 0; i < 2; i++) data += String.fromCharCode((recordLen >> (i * 8)) & 0xFF);
        for (let i = 0; i < 20; i++) data += '\0';
        
        // 字段描述子
        this.fields.forEach(f => {
            const name = f.name.substring(0, 11);
            for (let i = 0; i < 11; i++) data += (name.charCodeAt(i) ? String.fromCharCode(name.charCodeAt(i)) : '\0');
            data += f.type;
            data += '\0';
            data += String.fromCharCode(f.len);
            data += String.fromCharCode(f.dec || 0);
            for (let i = 0; i < 14; i++) data += '\0';
        });
        data += '\r';
        
        // 数据记录
        this.records.forEach(record => {
            data += ' ';
            this.fields.forEach((f, i) => {
                let val = String(record[i] || '').substring(0, f.len);
                if (f.type === 'N') val = val.padStart(f.len, ' ');
                else val = val.padEnd(f.len, ' ');
                data += val;
            });
        });
        data += '\x1A';
        return data;
    }
}

// ============================================================
// 场内基金清算文件生成工具 V2.10
// 数据来源：交易所官方数据接口规范（JSMX字段规范）
// 更新说明：
// - 新增7种清算文件DBF生成功能：
//   深圳：SJSZJ(资金变动)、SJSJG(明细结果)、DSFMX(实时代收代付明细)
//   上海：gh(竞价过户)、bgh(综合业务过户)、CIL(现金差额)、etftbk(ETF退补款)
// ============================================================

let currentMarket = 'SH';

let records = [];
let recordIdCounter = 1;
let generatedFiles = [];

// 日期偏移配置：TN表示T+N日
const DATE_OFFSET_MAP = {
    'T': 0, 'T1': 1, 'TN': 2, 'TN1': 3, 'TN2': 4, 'T_同': 0
};

// 根据ZQLB获取ETF配置
function getETFConfigByZqlb(market, zqlb) {
    const key = market + '_' + zqlb;
    return ETF_SPLIT_RULES[key] || null;
}

// 获取业务拆分规则
function getETFSplitRules(market, zqlb, direction) {
    const config = getETFConfigByZqlb(market, zqlb);
    if (!config) return null;
    return direction === '申购' ? config.purchase : config.redeem;
}

// 获取所有需要的日期和文件
function getETFFileSchedule(market, zqlb, direction) {
    const rules = getETFSplitRules(market, zqlb, direction);
    if (!rules) return [];
    
    const schedule = [];
    Object.entries(rules).forEach(([dateKey, dateConfig]) => {
        const offset = DATE_OFFSET_MAP[dateKey] || 0;
        dateConfig.files.forEach(file => {
            schedule.push({
                dateKey: dateKey,
                offset: offset,
                fileType: file.type,
                splits: file.splits || [{ywlb: file.ywlb || '', label: file.label || ''}],
                label: file.label || ''
            });
        });
    });
    return schedule;
}

// ============================================================
// 更新业务类型网格（按分类折叠，支持搜索）
// ============================================================
function updateBizGrid() {
    const grid = document.getElementById('bizGrid');
    const config = currentMarket === 'SH' ? SH_BUSINESS_CONFIG : SZ_BUSINESS_CONFIG;
    
    // 搜索功能
    const searchInput = document.getElementById('bizSearch');
    const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
    
    // 按分类分组
    const categories = {};
    Object.entries(config).forEach(([key, biz]) => {
        // 搜索过滤
        if (searchTerm && !key.toLowerCase().includes(searchTerm) && 
            !biz.name.toLowerCase().includes(searchTerm) &&
            !biz.direction.toLowerCase().includes(searchTerm)) {
            return;
        }
        const cat = biz.category || '其他';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push({ key, biz });
    });
    
    // 分类图标
    const categoryIcons = { 
        'ETF': '📊', 
        'LOF': '📋', 
        'REITS': '🏢', 
        'SJSZJ': '💰',
        'SJSJG': '📋',
        'DSFMX': '💳',
        'GH': '📝',
        'BGH': '📋',
        'CIL': '💹',
        'ETFTBK': '💸',
        '其他': '📄' 
    };
    
    let html = '';
    
    // 如果有搜索词，显示搜索结果
    if (searchTerm) {
        let totalCount = 0;
        Object.values(categories).forEach(items => totalCount += items.length);
        html += `<div class="search-result-header">🔍 搜索"${searchTerm}"，找到 ${totalCount} 个</div>`;
    }
    
    Object.entries(categories).forEach(([cat, items]) => {
        if (items.length === 0) return;
        const isCollapsed = searchTerm ? '' : 'collapsed';
        
        html += `
            <div class="biz-category" data-category="${cat}">
                <div class="biz-category-header ${isCollapsed}" onclick="toggleCategory('${cat}')">
                    <span class="icon">${categoryIcons[cat] || '📄'}</span>
                    <span class="name">${cat}</span>
                    <span class="count">${items.length}</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="biz-category-items ${isCollapsed}" id="items-${cat}">
                    ${items.map(({ key, biz }) => `
                        <div class="biz-item ${currentBizType === key ? 'active' : ''}" 
                             onclick="selectBizType('${key}')">
                            <div class="icon">${biz.icon}</div>
                            <div class="name">${biz.name}-${biz.direction}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    });
    
    if (Object.keys(categories).length === 0) {
        html = '<div class="empty-msg">没有找到匹配的业务类型</div>';
    }
    
    grid.innerHTML = html;
}

// ============================================================
// 折叠/展开分类

function toggleCategory(cat) {
    const header = document.querySelector(`.biz-category[data-category="${cat}"] .biz-category-header`);
    const items = document.getElementById(`items-${cat}`);
    header.classList.toggle('collapsed');
    items.classList.toggle('collapsed');
}

// ============================================================
// 选择业务类型
// ============================================================
function selectBizType(bizType) {
    currentBizType = bizType;
    
    // 更新选中状态
    document.querySelectorAll('.biz-item').forEach(item => {
        const name = item.querySelector('.name').textContent;
        const [etfName, direction] = name.split('-');
        const fullName = bizType;
        item.classList.toggle('active', item.querySelector('.name').textContent === name && bizType.includes(etfName) && bizType.includes(direction));
    });
    
    // 更新记录
    if (records.length === 0) addRecord();
    if (records[0] && !records[0].bizType) {
        records[0].bizType = bizType;
        updateRecordFields(records[0]);
    }
    
    // 显示拆分预览
    showSplitPreview(bizType);
    
    // 更新状态栏
    updateStatusInfo();
}

// ============================================================
// 显示拆分预览（V2.10 新版ETF拆分规则）
// ============================================================
function showSplitPreview(bizType) {
    const previewDiv = document.getElementById('splitPreview');
    if (!previewDiv) return;
    
    const bizConfig = getBizConfig(bizType);
    if (!bizConfig) {
        previewDiv.style.display = 'none';
        return;
    }
    
    // 检查是否使用新的ETF拆分规则
    const etfConfig = getETFConfigByZqlb(currentMarket, bizConfig.zqlb);
    if (bizConfig.autoSplit && etfConfig) {
        const direction = bizConfig.direction;
        const rules = direction === '申购' ? etfConfig.purchase : etfConfig.redeem;
        
        let html = '<div style="font-size: 11px; color: var(--accent-yellow); margin-bottom: 8px;">📋 ETF多日多文件拆分规则：</div>';
        
        // 按日期分组显示
        Object.entries(rules).forEach(([dateKey, dateConfig]) => {
            const dateLabel = getDateLabel(dateKey);
            let filesInfo = dateConfig.files.map(f => {
                if (f.splits && f.splits.length > 0) {
                    const labels = f.splits.map(s => s.label || s.ywlx || s.ywlb).join('+');
                    return f.type + '(' + labels + ')';
                }
                return f.type + '(' + (f.label || f.ywlb || '') + ')';
            }).join(' + ');
            
            html += \`
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding: 6px 8px; background: var(--bg-input); border-radius: 4px;">
                    <span style="background: \${dateKey === 'T' ? 'var(--accent-blue)' : dateKey.includes('TN') ? 'var(--accent-purple)' : 'var(--accent-cyan)'}; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px;">\${dateLabel}</span>
                    <span style="color: var(--text-primary); font-size: 11px;">\${filesInfo}</span>
                </div>
            \`;
        });
        
        previewDiv.style.display = 'block';
        previewDiv.innerHTML = html;
    } else if (bizConfig.autoSplit && bizConfig.splitConfig && bizConfig.splitConfig.length > 0) {
        // 旧版拆分规则
        previewDiv.style.display = 'block';
        previewDiv.innerHTML = \`
            <div style="font-size: 11px; color: var(--accent-yellow); margin-bottom: 8px;">📋 将自动拆分为以下\${bizConfig.splitConfig.length}条记录：</div>
            \${bizConfig.splitConfig.map((split, i) => \`
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding: 6px 8px; background: var(--bg-input); border-radius: 4px;">
                    <span style="background: var(--accent-purple); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px;">\${i + 1}</span>
                    <span style="color: var(--text-primary); font-size: 12px;">\${split.label}</span>
                    <span style="color: var(--text-secondary); font-size: 10px; margin-left: auto;">YWLX:\${split.ywlx}</span>
                </div>
            \`).join('')}
        \`;
    } else {
        previewDiv.style.display = 'none';
    }
}

// 获取日期标签
function getDateLabel(dateKey) {
    switch(dateKey) {
        case 'T': return 'T日';
        case 'T1': return 'T+1日';
        case 'TN': return 'T+N日';
        case 'TN1': return 'T+N+1日';
        case 'TN2': return 'T+N+2日';
        case 'T_同': return 'T日(同)';
        default: return dateKey;
    }
}
// ============================================================
// 选择生成天数
// ============================================================
function selectDays(days) {
    if (selectedDays.includes(days)) {
        if (selectedDays.length > 1) selectedDays = selectedDays.filter(d => d !== days);
    } else {
        selectedDays.push(days);
    }
    selectedDays.sort((a, b) => a - b);
    document.querySelectorAll('.day-tab').forEach(tab => {
        tab.classList.toggle('active', selectedDays.includes(parseInt(tab.dataset.days)));
    });
    updateDatePreview();
}

// ============================================================
// 更新日期预览
// ============================================================
function updateDatePreview() {
    const startDate = document.getElementById('startDate').value;
    const previewItems = document.getElementById('datePreviewItems');
    if (!startDate || startDate.length !== 8) {
        previewItems.innerHTML = '<div style="color: var(--accent-red); font-size: 11px;">请输入8位日期格式</div>';
        return;
    }
    const baseDate = new Date(startDate.substring(0, 4) + '-' + startDate.substring(4, 6) + '-' + startDate.substring(6, 8));
    previewItems.innerHTML = selectedDays.map(days => {
        const targetDate = new Date(baseDate);
        targetDate.setDate(targetDate.getDate() + (days - 1));
        const dateStr = formatDate(targetDate);
        const label = days === 1 ? 'T日' : 'T+' + (days-1) + '日';
        return '<div class="date-preview-item"><span class="label">' + label + '</span><span class="value">' + dateStr + '</span></div>';
    }).join('');
}

            if (bizConfig.zqlb) ywxx += ` | ZQLB:${bizConfig.zqlb}`;
        }

                        <button class="sample-btn" onclick="fillSampleData(${record.id})">📝 示例</button>
                        <button onclick="copyRecord(${record.id})">📋 复制</button>

// ============================================================
// 获取业务配置
// ============================================================
function getBizConfig(bizType) {
    if (!bizType) return null;
    const config = currentMarket === 'SH' ? SH_BUSINESS_CONFIG : SZ_BUSINESS_CONFIG;
    return config[bizType] || null;
}

// ============================================================
// 获取字段配置
// ============================================================
function getFieldConfig(fileType) {
    switch (fileType) {
        case 'JSMX': return SH_JSMX_FIELDS;
        case 'KF1': return SH_KF1_FIELDS;
        case 'SJSMX': return SZ_SJSMX_FIELDS;
        case 'SJSFX': return SZ_SJSFX_FIELDS;
        case 'SJSZJ': return SZ_SJSZJ_FIELDS;
        case 'SJSJG': return SZ_SJSJG_FIELDS;
        case 'DSFMX': return SZ_DSFMX_FIELDS;
        case 'SJJG': return SZ_SJJG_FIELDS;
        case 'GH': return SH_GH_FIELDS;
        case 'BGH': return SH_BGH_FIELDS;
        case 'CIL': return SH_CIL_FIELDS;
        case 'ETFTBK': return SH_ETFTBK_FIELDS;

    }
}

// ============================================================
// 渲染字段表单
// ============================================================
function renderFieldForm(record, fields) {
    let html = '';
    
    // 日期字段
    const dateFields = fields.filter(f => f.date);
    if (dateFields.length > 0) {
        html += '<div class="field-section"><div class="field-section-title">📅 日期信息</div><div class="field-grid field-grid-3">' + 
            dateFields.map(f => renderFieldInput(record, f)).join('') + '</div></div>';
    }
    
    // 账户字段
    const accountFields = fields.filter(f => 
        ['ZQZH', 'ZJZH', 'XWH1', 'JSHY', 'MXJSZH', 'MXBFZH', 'MXJYDY', 'MXTGDY', 'MXZQZH'].includes(f.name)
    );
    if (accountFields.length > 0) {
        html += '<div class="field-section"><div class="field-section-title">💼 账户信息</div><div class="field-grid">' + 
            accountFields.map(f => renderFieldInput(record, f)).join('') + '</div></div>';
    }
    
    // 交易字段
    const tradeFields = fields.filter(f => 
        ['ZQDM1', 'ZQDM', 'MXZQDM', 'FXZQDM', 'CJSL', 'SL', 'MXCJSL', 'MXQSSL', 'FXCJSL',
         'JG1', 'MXCJJG', 'MXQSJG', 'QSJE', 'MXQSBJ', 'FXQSJE', 'CJJE', 'ZQLB', 'MXZQLB', 'MMBZ'].includes(f.name)
    );
    if (tradeFields.length > 0) {
        html += '<div class="field-section"><div class="field-section-title">📊 交易信息</div><div class="field-grid">' + 
            tradeFields.map(f => renderFieldInput(record, f)).join('') + '</div></div>';
    }
    
    // 费用字段
    const feeFields = fields.filter(f => 
        ['YHS', 'JSF', 'GHF', 'ZGF', 'SXF', 'MXJYJSF', 'MXJGGF', 'MXJSF', 'MXSXF', 'FXJSF', 'FXJGGF', 'FXSXF'].includes(f.name)
    );
    if (feeFields.length > 0) {
        html += '<div class="field-section"><div class="field-section-title">💰 清算费用</div><div class="field-grid field-grid-3">' + 
            feeFields.map(f => renderFieldInput(record, f)).join('') + '</div></div>';
    }
    
    // 收付字段
    const amountFields = fields.filter(f => 
        ['SJSF', 'MXSFJE', 'FXSFJE', 'MXZJJE'].includes(f.name)
    );
    if (amountFields.length > 0) {
        html += '<div class="field-section"><div class="field-section-title">💵 收付金额</div><div class="field-grid">' + 
            amountFields.map(f => renderFieldInput(record, f)).join('') + '</div>';
        if (currentMarket === 'SH') {
            html += '<div class="formula-hint">📐 上海: SJSF = QSJE + YHS + JSF + GHF + ZGF + SXF + QTJE1~3</div>';
        } else {
            html += '<div class="formula-hint">📐 深圳: MXSFJE = MXQSBJ + MXYHS + MXJYJSF + MXJGGF + MXGHF + MXJSF + MXSXF + MXQTFY + MXZJJE</div>';
        }
        html += '</div>';
    }
    
    // 业务标识字段
    const flagFields = fields.filter(f => 
        ['YWLX', 'QSBZ', 'GHLX', 'MXYWLB', 'MXJSFS', 'FXYWLB'].includes(f.name)
    );
    if (flagFields.length > 0) {
        html += '<div class="field-section"><div class="field-section-title">🏷️ 业务标识</div><div class="field-grid field-grid-3">' + 
            flagFields.map(f => renderFieldInput(record, f)).join('') + '</div></div>';
    }
    
    return html;
}

// ============================================================
// 渲染字段输入框
// ============================================================
function renderFieldInput(record, field) {
    const value = record.fields[field.name] || field.default || '';
    let inputClass = 'field-input';
    if (field.readonly) inputClass += ' readonly';
    else if (field.auto) inputClass += ' auto';
    else if (field.user) inputClass += ' user';
    const readOnlyAttr = field.readonly || field.auto ? 'readonly' : '';
    const onChange = (field.readonly || field.auto) ? '' : 'onchange="updateField(' + record.id + ', \'' + field.name + '\', this.value)"';
    const onInput = field.auto ? 'oninput="calcActualAmount(' + record.id + ')"' : '';
    
    // 生成友好的placeholder
    let placeholder = '';
    if (field.placeholder) {
        placeholder = field.placeholder;
    } else if (field.example) {
        placeholder = field.example;
    } else if (value && value.trim()) {
        placeholder = value;
    } else {
        placeholder = '-';
    }
    
    return '<div class="field-item">' +
           '<span class="field-label">' + field.desc + '</span>' +
           '<input type="text" class="' + inputClass + '" data-record="' + record.id + '" data-field="' + field.name + '" value="' + value + '" ' + readOnlyAttr + ' ' + onChange + ' ' + onInput + ' placeholder="' + placeholder + '">' +
           '<span class="field-length">' + field.len + field.type + '</span>' +
           '</div>';
}

// ============================================================
// 更新记录字段
// ============================================================
function updateRecordFields(record) {
    const bizConfig = getBizConfig(record.bizType);
    if (!bizConfig) return;
    
    // 设置业务标识
    if (bizConfig.ywlx) record.fields['YWLX'] = bizConfig.ywlx;
    if (bizConfig.ywlb) {
        if (bizConfig.fileType === 'SJSFX') record.fields['FXYWLB'] = bizConfig.ywlb;
        else record.fields['MXYWLB'] = bizConfig.ywlb;
    }
    if (bizConfig.qsbz) record.fields['QSBZ'] = bizConfig.qsbz;
    if (bizConfig.zqlb) record.fields['ZQLB'] = bizConfig.zqlb;
    if (bizConfig.zqlb) record.fields['MXZQLB'] = bizConfig.zqlb;
    
    // 设置买卖标志和成交数量正负
    // 深圳ETF买卖共用YWLB=JY00，通过成交数量正负区分买卖方向
    if (currentMarket === 'SH') {
        if (bizConfig.direction === '买入') record.fields['MMBZ'] = 'B';
        else if (bizConfig.direction === '卖出') record.fields['MMBZ'] = 'S';
    } else {
        // 深圳ETF买卖：JY00通过成交数量正负区分
        if (bizConfig.ywlb === 'JY00') {
            if (bizConfig.direction === '买入') {
                // 成交数量>0，买入金额>0
            } else if (bizConfig.direction === '卖出') {
                // 成交数量<0，买入金额<0 (清算本金为负)
            }
        }
    }
    
    // 设置市场默认值
    if (currentMarket === 'SH') {
        record.fields['SCDM'] = '01';
        record.fields['JYFS'] = bizConfig.jyfs || '001';
        record.fields['JSFS'] = '001';
        record.fields['BZ'] = 'RMB';
        // 根据业务类型设置JLLX和GHLX
        if (bizConfig.jllx) {
            record.fields['JLLX'] = bizConfig.jllx;
        } else {
            record.fields['JLLX'] = '001';
        }
        if (bizConfig.ghlx) {
            record.fields['GHLX'] = bizConfig.ghlx;
        }
    } else {
        record.fields['MXSJLX'] = bizConfig.fileType === 'SJSFX' ? '20' : '10';
        record.fields['MXHBDH'] = 'RMB';
        record.fields['FXSJLX'] = '20';
        record.fields['MXJSFS'] = '1';
    }
    
    // 设置日期
    const startDate = document.getElementById('startDate').value;
    if (currentMarket === 'SH') {
        record.fields['JYRQ'] = startDate;
        record.fields['QSRQ'] = startDate;
        record.fields['JSRQ'] = addDays(startDate, 1);
    } else {
        record.fields['FXCJRQ'] = startDate;
        record.fields['FXQSRQ'] = startDate;
        record.fields['FXJSRQ'] = addDays(startDate, 1);
    }
    
    // 应用全局账户
    Object.keys(globalAccounts).forEach(key => {
        record.fields[key] = globalAccounts[key];
    });
    
    renderRecords();
}

// ============================================================
// 更新字段值
// ============================================================
function updateField(recordId, fieldName, value) {
    const record = records.find(r => r.id === recordId);
    if (!record) return;
    record.fields[fieldName] = value;
    
    // 日期联动
    if (fieldName === 'JYRQ' || fieldName === 'FXCJRQ') {
        if (currentMarket === 'SH') {
            record.fields['QSRQ'] = value;
            record.fields['JSRQ'] = addDays(value, 1);
        } else {
            record.fields['FXQSRQ'] = value;
            record.fields['FXJSRQ'] = addDays(value, 1);
        }
        renderRecords();
    }
    
    calcActualAmount(recordId);
}

// ============================================================
// 计算实际收付
// ============================================================
function calcActualAmount(recordId) {
    const record = records.find(r => r.id === recordId);
    if (!record) return;
    
    if (currentMarket === 'SH') {
        const qsje = parseFloat(record.fields['QSJE'] || 0);
        const yhs = parseFloat(record.fields['YHS'] || 0);
        const jsf = parseFloat(record.fields['JSF'] || 0);
        const ghf = parseFloat(record.fields['GHF'] || 0);
        const zgf = parseFloat(record.fields['ZGF'] || 0);
        const sxf = parseFloat(record.fields['SXF'] || 0);
        const qtje1 = parseFloat(record.fields['QTJE1'] || 0);
        const qtje2 = parseFloat(record.fields['QTJE2'] || 0);
        const qtje3 = parseFloat(record.fields['QTJE3'] || 0);
        const sjsf = qsje + yhs + jsf + ghf + zgf + sxf + qtje1 + qtje2 + qtje3;
        record.fields['SJSF'] = formatAmount(sjsf, 19);
        updateFieldDisplay(recordId, 'SJSF', record.fields['SJSF']);
    } else {
        const qsbj = parseFloat(record.fields['MXQSBJ'] || 0);
        const yhs = parseFloat(record.fields['MXYHS'] || 0);
        const jyjsf = parseFloat(record.fields['MXJYJSF'] || 0);
        const jggf = parseFloat(record.fields['MXJGGF'] || 0);
        const ghf = parseFloat(record.fields['MXGHF'] || 0);
        const jsff = parseFloat(record.fields['MXJSF'] || 0);
        const sxf = parseFloat(record.fields['MXSXF'] || 0);
        const qtffy = parseFloat(record.fields['MXQTFY'] || 0);
        const zjje = parseFloat(record.fields['MXZJJE'] || 0);
        const sfje = qsbj + yhs + jyjsf + jggf + ghf + jsff + sxf + qtffy + zjje;
        record.fields['MXSFJE'] = formatAmount(sfje, 17);
        updateFieldDisplay(recordId, 'MXSFJE', record.fields['MXSFJE']);
    }
}

function updateFieldDisplay(recordId, fieldName, value) {
    const input = document.querySelector('[data-record="' + recordId + '"][data-field="' + fieldName + '"]');
    if (input) input.value = value;
}

// ============================================================
// 复制记录
// ============================================================
function copyRecord(recordId) {
    const original = records.find(r => r.id === recordId);
    if (!original) return;
    const newRecord = {
        id: recordIdCounter++,
        bizType: original.bizType,
        fields: { ...original.fields },
        dates: { ...original.dates }
    };
    records.push(newRecord);
    renderRecords();
    updateRecordCount();
}

// ============================================================
// 删除记录
// ============================================================
function deleteRecord(recordId) {
    records = records.filter(r => r.id !== recordId);
    renderRecords();
    updateRecordCount();
    if (records.length === 0) addRecord();
}

// ============================================================
// 生成清算文件
// ============================================================
// ============================================================
// 根据文件类型收集记录到对应分组
// ============================================================
function collectRecordToGroup(dateGroups, targetDate, fileType, record, bizConfig, split) {
    // 确保日期组存在
    const startDate = document.getElementById('startDate').value;
    const dayOffset = getDayOffset(targetDate, startDate) + 1;
    const dateLabel = dayOffset === 1 ? 'T日' : 'T+' + (dayOffset-1) + '日';
    
    if (!dateGroups[targetDate]) {
        dateGroups[targetDate] = {
            dateLabel: dateLabel,
            shJsmx: [], szJsmx: {}, shKf1: [], szSjsfx: [],
            szSjszj: {}, szSjsjg: {}, szDsfmx: {}, szSjjg: {},
            shGh: {}, shBgh: {}, shCil: {}, shEtftbk: {},
            shSjjg: {}
        };
    }
    
    if (currentMarket === 'SH') {
        switch(fileType) {
            case 'JSMX':
                dateGroups[targetDate].shJsmx.push({ record, bizConfig, split });
                break;
            case 'BGH':
                const bghKey = record.fields['XWH1'] || '00000';
                if (!dateGroups[targetDate].shBgh[bghKey]) dateGroups[targetDate].shBgh[bghKey] = [];
                dateGroups[targetDate].shBgh[bghKey].push({ record, bizConfig, split });
                break;
            case 'CIL':
                const cilKey = record.fields['ZQDM1'] || record.fields['JJDM'] || '000000';
                if (!dateGroups[targetDate].shCil[cilKey]) dateGroups[targetDate].shCil[cilKey] = [];
                dateGroups[targetDate].shCil[cilKey].push({ record, bizConfig, split });
                break;
            case 'ETFTBK':
                const tbkKey = record.fields['ZQDM1'] || record.fields['JJDM'] || '000000';
                if (!dateGroups[targetDate].shEtftbk[tbkKey]) dateGroups[targetDate].shEtftbk[tbkKey] = [];
                dateGroups[targetDate].shEtftbk[tbkKey].push({ record, bizConfig, split });
                break;
        }
    } else {
        const ywlb = split.ywlb || record.fields['MXYWLB'] || bizConfig.ywlb;
        switch(fileType) {
            case 'SJSMX1':
            case 'SJSMX':
                if (!dateGroups[targetDate].szJsmx[ywlb]) dateGroups[targetDate].szJsmx[ywlb] = [];
                dateGroups[targetDate].szJsmx[ywlb].push({ record, bizConfig, split });
                break;
            case 'SJSMX2':
                if (!dateGroups[targetDate].szJsmx[ywlb]) dateGroups[targetDate].szJsmx[ywlb] = [];
                dateGroups[targetDate].szJsmx[ywlb].push({ record, bizConfig, split });
                break;
            case 'DSFMX':
                if (!dateGroups[targetDate].szDsfmx[ywlb]) dateGroups[targetDate].szDsfmx[ywlb] = [];
                dateGroups[targetDate].szDsfmx[ywlb].push({ record, bizConfig, split });
                break;
            case 'SJSZJ':
                if (!dateGroups[targetDate].szSjszj[ywlb]) dateGroups[targetDate].szSjszj[ywlb] = [];
                dateGroups[targetDate].szSjszj[ywlb].push({ record, bizConfig, split });
                break;
            case 'SJSJG':
                if (!dateGroups[targetDate].szSjsjg[ywlb]) dateGroups[targetDate].szSjsjg[ywlb] = [];
                dateGroups[targetDate].szSjsjg[ywlb].push({ record, bizConfig, split });
                break;
            case 'SJJG':
                if (!dateGroups[targetDate].szSjjg[ywlb]) dateGroups[targetDate].szSjjg[ywlb] = [];
                dateGroups[targetDate].szSjjg[ywlb].push({ record, bizConfig, split });
                break;
        }
    }
}

// ============================================================
// 获取日期偏移量
// ============================================================
function getDayOffset(dateStr, baseDateStr) {
    const date = new Date(dateStr.substring(0, 4) + '-' + dateStr.substring(4, 6) + '-' + dateStr.substring(6, 8));
    const base = new Date(baseDateStr.substring(0, 4) + '-' + baseDateStr.substring(4, 6) + '-' + baseDateStr.substring(6, 8));
    return Math.round((date - base) / (1000 * 60 * 60 * 24));
}


function generateAll() {
    if (records.length === 0 || records.every(r => !r.bizType)) {
        alert('请先选择业务类型并填写记录');
        return;
    }
    
    const startDate = document.getElementById('startDate').value;
    if (!startDate || startDate.length !== 8) {
        alert('请输入正确的起始日期（YYYYMMDD格式）');
        return;
    }
    
    generatedFiles = [];
    
    // 按日期分组收集数据
    const dateGroups = {};
    
    selectedDays.forEach(dayOffset => {
        const targetDate = addDays(startDate, dayOffset - 1);
        const dateLabel = dayOffset === 1 ? 'T日' : 'T+' + (dayOffset-1) + '日';
        
        // 初始化当天的分组
        if (!dateGroups[targetDate]) {
            dateGroups[targetDate] = {
                dateLabel: dateLabel,
                shJsmx: [],  // 上海JSMX记录
                szJsmx: {},   // 深圳SJSMX按业务类别分组
                shKf1: [],    // 上海KF1记录
                szSjsfx: [],  // 深圳SJSFX记录
                szSjszj: {},  // 深圳SJSZJ按业务类别分组
                szSjsjg: {},  // 深圳SJSJG按业务类别分组
                szDsfmx: [],  // 深圳DSFMX记录
                shGh: {},     // 上海gh按席位号分组
                shBgh: {},    // 上海bgh按席位号分组
                shCil: {},    // 上海CIL按基金代码分组
                shEtftbk: {},  // 上海etftbk按基金代码分组
                szSjjg: {}    // 深圳SJJG按业务类别分组
            };
        }
        
        records.forEach(record => {
            if (!record.bizType) return;
            
            const bizConfig = getBizConfig(record.bizType);
            if (!bizConfig) return;
            
            // 检查是否需要自动拆分
            if (bizConfig.autoSplit && bizConfig.splitConfig && bizConfig.splitConfig.length > 0) {
                // 使用新的ETF业务拆分逻辑
                const etfConfig = getETFConfigByZqlb(currentMarket, bizConfig.zqlb);
                if (etfConfig && ETF_SPLIT_RULES[currentMarket + '_' + bizConfig.zqlb]) {
                    // 新版ETF拆分逻辑
                    const direction = bizConfig.direction;
                    const rules = direction === '申购' ? etfConfig.purchase : etfConfig.redeem;
                    
                    // 遍历各日期的拆分规则
                    Object.entries(rules).forEach(([dateKey, dateConfig]) => {
                        const requiredOffset = DATE_OFFSET_MAP[dateKey] || 0;
                        
                        // 检查当前日期是否匹配
                        if (dayOffset - 1 !== requiredOffset) return;
                        
                        const targetDateForRule = addDays(startDate, requiredOffset);
                        
                        // 遍历该日期的所有文件
                        dateConfig.files.forEach(fileConfig => {
                            if (fileConfig.splits && fileConfig.splits.length > 0) {
                                // 有多条拆分记录
                                fileConfig.splits.forEach((split, index) => {
                                    const splitRecord = JSON.parse(JSON.stringify(record));
                                    splitRecord.id = recordIdCounter++;
                                    splitRecord.subType = split.label || split.ywlx || split.ywlb;
                                    splitRecord.splitInfo = split;
                                    splitRecord.fields = { ...record.fields };
                                    
                                    // 应用拆分配置
                                    if (split.ywlx) splitRecord.fields['YWLX'] = split.ywlx;
                                    if (split.qsbz) splitRecord.fields['QSBZ'] = split.qsbz;
                                    if (split.ghlx) splitRecord.fields['GHLX'] = split.ghlx;
                                    if (split.jyfs) splitRecord.fields['JYFS'] = split.jyfs;
                                    if (split.ywlb) splitRecord.fields['MXYWLB'] = split.ywlb;
                                    
                                    // 根据文件类型收集记录
                                    collectRecordToGroup(dateGroups, targetDateForRule, fileConfig.type, splitRecord, bizConfig, split);
                                });
                            } else {
                                // 单条记录
                                const singleRecord = JSON.parse(JSON.stringify(record));
                                singleRecord.id = recordIdCounter++;
                                singleRecord.subType = fileConfig.label;
                                singleRecord.splitInfo = { ywlb: fileConfig.ywlb };
                                singleRecord.fields = { ...record.fields };
                                if (fileConfig.ywlb) singleRecord.fields['MXYWLB'] = fileConfig.ywlb;
                                
                                collectRecordToGroup(dateGroups, targetDateForRule, fileConfig.type, singleRecord, bizConfig, { ywlb: fileConfig.ywlb });
                            }
                        });
                    });
                } else {
                    // 旧版简单拆分逻辑（T+2日生成CIL/etftbk）

                        const jjdm = record.fields['JJDM'] || '000000';
                        
                        // CIL现金差额
                        const cilRecord = JSON.parse(JSON.stringify(record));
                        cilRecord.id = recordIdCounter++;
                        cilRecord.subType = '现金差额';
                        cilRecord.fields = { ...record.fields };

// ============================================================
// 生成上海JSMX
// ============================================================
function generateSHJSMX(record, date) {
    const fields = SH_JSMX_FIELDS;
    let line = '';
    fields.forEach(field => {
        let value = record.fields[field.name] || field.default || '';
        if (field.date) {
            if (field.name === 'JSRQ') value = addDays(date, 1);
            else value = date;
        }
        if (field.type === 'N') {
            value = formatAmount(parseFloat(value) || 0, field.len);
        } else if (value === '' || value === undefined) {
            value = ' '.repeat(field.len);
        } else {
            value = String(value).padEnd(field.len).substring(0, field.len);
        }
        line += value;
    });
    return line + '\n';
}

// ============================================================
// 生成深圳SJSMX
// ============================================================
function generateSZSJSMX(record, date) {
    const fields = SZ_SJSMX_FIELDS;
    const bizConfig = getBizConfig(record.bizType);
    
    let line = '';
    fields.forEach(field => {
        let value = record.fields[field.name] || field.default || '';
        
        // 深圳ETF买卖(JY00)通过成交数量正负区分买卖方向
        if (bizConfig && bizConfig.ywlb === 'JY00') {
            if (field.name === 'MXCJSL' && value) {
                const num = parseFloat(value) || 0;
                if (bizConfig.direction === '卖出' && num > 0) {
                    value = -Math.abs(num); // 卖出时成交数量取负
                }
            }
            if (field.name === 'MXQSBJ' && value) {
                const num = parseFloat(value) || 0;
                if (bizConfig.direction === '卖出' && num > 0) {
                    value = -Math.abs(num); // 卖出时清算本金取负
                }
            }
        }
        
        if (field.type === 'N') {
            value = formatAmount(parseFloat(value) || 0, field.len);
        } else if (value === '' || value === undefined) {
            value = ' '.repeat(field.len);
        } else {
            value = String(value).padEnd(field.len).substring(0, field.len);
        }
        line += value;
    });
    return line + '\n';
}

// ============================================================
// 生成深圳SJSFX
// ============================================================
function generateSZSJSFX(record, date) {
    const fields = SZ_SJSFX_FIELDS;
    let line = '';
    fields.forEach(field => {
        let value = record.fields[field.name] || field.default || '';
        if (field.date) {
            if (field.name === 'FXJSRQ') value = addDays(date, 1);
            else value = date;
        }
        if (field.type === 'N') {
            value = formatAmount(parseFloat(value) || 0, field.len);
        } else if (value === '' || value === undefined) {
            value = ' '.repeat(field.len);
        } else {
            value = String(value).padEnd(field.len).substring(0, field.len);
        }
        line += value;
    });
    return line + '\n';
}

// ============================================================
// 渲染输出文件
// ============================================================
function renderOutputFiles() {
    const container = document.getElementById('outputFiles');
    if (generatedFiles.length === 0) {
        container.innerHTML = '<div class="empty-msg">暂无生成文件</div>';
        return;
    }
    
    const grouped = {};
    generatedFiles.forEach(file => {
        const key = file.dateLabel;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(file);
    });
    
    container.innerHTML = Object.entries(grouped).map(([label, files]) => `
        <div style="margin-bottom: 16px;">
            <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">📅 ${label}</div>
            ${files.map(file => `
                <div class="output-file">
                    <span class="name">${file.name}</span>
                    <div class="info">
                        <span class="size">${file.market} | ${file.ywxx}${file.subType ? ' | ' + file.subType : ''}</span>
                        <button class="download-btn" onclick="downloadFile('${file.name}', ${JSON.stringify(file.content).replace(/"/g, '&quot;')})">下载</button>
                    </div>
                </div>
            `).join('')}
        </div>
    `).join('');
}

// ============================================================
// 下载单个文件
// ============================================================
function downloadFile(fileName, content) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
}

// ============================================================
// 打包下载
// ============================================================
function downloadAll() {
    if (generatedFiles.length === 0) {
        alert('请先生成文件');
        return;
    }
    const zipContent = generatedFiles.map(f => '=== ' + f.name + ' ===\n' + f.content).join('\n');
    const blob = new Blob([zipContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '清算文件_' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '.txt';
    a.click();
    URL.revokeObjectURL(url);
}

// ============================================================
// 工具函数
// ============================================================
function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return y + '' + m + '' + d;
}

function addDays(dateStr, days) {
    const date = new Date(dateStr.substring(0, 4) + '-' + dateStr.substring(4, 6) + '-' + dateStr.substring(6, 8));
    date.setDate(date.getDate() + days);
    return formatDate(date);
}

function formatAmount(value, len = 19) {
    const str = Math.abs(value).toFixed(2);
    const sign = value < 0 ? '-' : '';
    return sign + str.padStart(len - 1, '0');
}

function updateStatusInfo() {
    const info = document.getElementById('statusInfo');
    const bizConfig = currentBizType ? getBizConfig(currentBizType) : null;
    let text = '就绪';
    if (bizConfig) {
        text = currentMarket + ' | ' + bizConfig.name + '-' + bizConfig.direction + ' | ';
        if (bizConfig.ywlx) text += 'YWLX:' + bizConfig.ywlx;
        if (bizConfig.ywlb) text += 'YWLB:' + bizConfig.ywlb;
        if (bizConfig.zqlb) text += ' | ZQLB:' + bizConfig.zqlb;
    }
    info.textContent = text;
    updateRecordCount();
}

// ============================================================
// 更新记录统计
// ============================================================
function updateRecordCount() {
    const countDiv = document.getElementById('recordCount');
    const genPreview = document.getElementById('genPreview');
    if (!countDiv) return;
    
    const validRecords = records.filter(r => r.bizType);
    if (validRecords.length === 0) {
        countDiv.innerHTML = '';
        if (genPreview) genPreview.innerHTML = '';
        return;
    }
    
    // 统计各业务类型的数量
    const stats = {};
    validRecords.forEach(r => {
        const config = getBizConfig(r.bizType);
        if (config) {
            const key = config.name + '-' + config.direction;
            if (!stats[key]) stats[key] = { count: 0, splitCount: config.autoSplit ? config.splitConfig.length : 1 };
            stats[key].count++;
        }
    });
    
    // 计算预估生成文件数
    let totalFiles = 0;
    Object.values(stats).forEach(s => {
        totalFiles += s.count * s.splitCount;
    });
    
    countDiv.innerHTML = `
        <span style="color: var(--accent-green);">📊 ${validRecords.length}条记录</span>
        ${Object.entries(stats).map(([name, data]) => ` | <span style="color: var(--text-secondary);">${name}×${data.count}</span>`).join('')}
    `;
    
    // 更新生成预览
    if (genPreview) {
        genPreview.innerHTML = `（预估 ${totalFiles} 个文件）`;
    }
}
